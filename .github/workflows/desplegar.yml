# ============================================================
# Desplegar desde GitHub: el camino ALTERNATIVO
#
# El camino principal es que Cloudflare se conecte al repositorio (Workers
# Builds, ver DEPLOY.md): no hace falta crear ningún token. Este workflow
# queda para cuando se quiera desplegar desde GitHub; sólo se lanza a mano
# (Actions → «Desplegar» → «Run workflow») y necesita en el repositorio:
#   CLOUDFLARE_API_TOKEN   (Workers Scripts: Edit, D1: Edit y
#                          Zone → Workers Routes: Edit sobre juancitoads.com)
#   CLOUDFLARE_ACCOUNT_ID
# Corre `npm run verificar` entero ANTES de publicar nada. Las llaves de la
# aplicación van en Cloudflare; si alguna está ADEMÁS en GitHub, la pone.
# ============================================================
name: Desplegar

on:
  workflow_dispatch:

concurrency:
  group: desplegar
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar los secretos de Cloudflare
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CUENTA: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          falta=""
          [ -z "$TOKEN" ]  && falta="$falta CLOUDFLARE_API_TOKEN"
          [ -z "$CUENTA" ] && falta="$falta CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$falta" ]; then
            echo "::error::Faltan secretos del repositorio:$falta (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verificar (lint, pruebas y build)
        run: npm run verificar

      - name: Aplicar las migraciones de D1
        run: npx wrangler d1 migrations apply agenda-personal-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Publicar el Worker
        run: |
          set -o pipefail
          npx wrangler deploy | tee "$RUNNER_TEMP/deploy.log"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Poner los secretos del Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CODIGO_ALTA: ${{ secrets.CODIGO_ALTA }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          META_API_KEY: ${{ secrets.META_API_KEY }}
        run: |
          archivo="$RUNNER_TEMP/secretos.json"
          node -e '
            const nombres = ["CODIGO_ALTA", "ANTHROPIC_API_KEY", "META_API_KEY"];
            const puestos = Object.fromEntries(nombres.filter((n) => process.env[n]).map((n) => [n, process.env[n]]));
            require("node:fs").writeFileSync(process.argv[1], JSON.stringify(puestos), { mode: 0o600 });
            console.log("Secretos que se ponen:", Object.keys(puestos).join(", ") || "ninguno");
          ' "$archivo"
          if [ "$(cat "$archivo")" != "{}" ]; then npx wrangler secret bulk "$archivo"; fi
          rm -f "$archivo"

      - name: Comprobar que contesta
        run: |
          respaldo=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1 || true)
          propia="https://agenda.juancitoads.com"
          contesta() { for i in 1 2 3 4 5; do curl -fsS --max-time 10 "$1/api/salud" >/dev/null 2>&1 && return 0; sleep 6; done; return 1; }
          if contesta "$propia"; then
            echo "### La aplicación está en $propia" >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$respaldo" ] && contesta "$respaldo"; then
            # La primera vez, el certificado del dominio propio puede tardar unos minutos.
            echo "::warning::$propia todavía no contesta (el certificado puede tardar unos minutos la primera vez). Mientras, está en $respaldo"
            echo "### La aplicación está en $respaldo ($propia, en unos minutos)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::El Worker no contestó en /api/salud."
            exit 1
          fi
