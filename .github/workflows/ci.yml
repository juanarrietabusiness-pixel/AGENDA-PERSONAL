name: CI

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # .npmrc lleva legacy-peer-deps: sin él, npm 10 se cae resolviendo los pares de vitest.
      - run: npm ci
      - run: npm run verificar
